name: Windows Production Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.10.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: uv lock --check
      - run: uv sync --locked --all-packages --group dev
      - name: Verify published client contracts are current
        env:
          ENV: testing
          ENABLE_REAL_TRADING: 'false'
          QMT_REAL_TRADING_ENABLED: 'false'
        run: uv run pytest tests/api/unit/test_client_contracts.py
      - run: npm run check
      - run: npm run lint:strict
      - run: npm run test:run
      - run: npm run build
        env:
          QUANTX_DOCS_VERSION: ${{ github.ref_name }}
          VITE_APP_ENV: production
      - name: Build versioned production bundle
        shell: pwsh
        run: >-
          .\ops\build-release.ps1
          -Version "${{ github.ref_name }}"
          -OutputDirectory ".runtime\release-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: quantx-${{ github.ref_name }}-windows-x64
          path: |
            .runtime/release-artifacts/quantx-${{ github.ref_name }}-windows-x64.zip
            .runtime/release-artifacts/quantx-${{ github.ref_name }}-windows-x64.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            .runtime/release-artifacts/quantx-${{ github.ref_name }}-windows-x64.zip
            .runtime/release-artifacts/quantx-${{ github.ref_name }}-windows-x64.zip.sha256
