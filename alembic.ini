[alembic]
script_location = %(here)s/packages/infrastructure/alembic
prepend_sys_path = %(here)s/packages/contracts/src %(here)s/packages/domain/src %(here)s/packages/application/src %(here)s/packages/infrastructure/src
path_separator = os
sqlalchemy.url = postgresql+asyncpg://unused:unused@127.0.0.1/unused

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
