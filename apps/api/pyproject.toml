[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "quantx-application",
  "quantx-contracts",
  "quantx-domain",
  "quantx-infrastructure",
  "pandas>=1.3.0",
  "numpy>=1.21.0",
  "akshare>=1.18.0",
  "fastapi>=0.68.0",
  "uvicorn>=0.15.0",
  "pydantic>=1.8.0",
  "strawberry-graphql[fastapi]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.0",
  "influxdb3-python>=0.13.0",
  "pyarrow>=10.0.0",
  "redis>=4.0.0",
  "python-dateutil>=2.8.0",
  "pypinyin>=0.55.0",
  "pytz>=2021.1",
  "loguru>=0.5.0",
  "aiofiles",
  "python-dotenv>=0.19.0",
  "pydantic-settings>=2.0.0",
  "websockets>=11.0.0",
  "httpx>=0.24.0",
  "requests>=2.28.0",
  "aiohttp>=3.8.0",
  "prometheus-client>=0.15.0",
  "psutil>=5.9.0",
  "pydantic[email]>=2.0.0",
  "openai>=2.16.0",
  "mcp>=0.9.0",
  "anyio>=4.12.1",
  "cryptography>=42.0.0",
  "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0",
  "ruff>=0.13.0",
  "pre-commit>=4.3.0",
  "pytest>=6.0.0",
  "pytest-asyncio>=0.15.0",
  "pytest-cov>=3.0.0",
  "pytest-xdist>=2.5.0",
  "pytest-env>=1.1.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "quantx_api*",
]
exclude = [
  "logs*",
  "htmlcov*",
  "__pycache__",
  "docs*",
  "tests*",
  "tasks*",
]

[tool.setuptools.package-dir]
"" = "src"
