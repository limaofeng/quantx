  """订阅策略状态流"""
  systemStrategies(strategyIds: [Int!] = null): StrategyStatusInfo!

  """订阅系统告警流"""
  systemAlerts(severityLevel: String = null): SystemAlert!

  """订阅部署状态流"""
  deploymentStatus(name: String!): DeploymentFlowRun!

  """订阅 Prefect 流程运行日志"""
  flowRunLogs(runId: String!, includeHistory: Boolean! = true): LogLine!

  """订阅策略实例事件流"""
  strategyInstanceEvents(instanceId: String!): StrategyInstanceEvent!

  """订阅策略运行实例的日志"""
  strategyLogs(runId: String!, levels: [String!] = null, includeHistory: Boolean! = true): StrategyLogEntry!

  """订阅策略运行实例的 Tick 数据（分时图）"""
  strategyTicks(runId: String!): StrategyTickData!

  """订阅策略运行实例的 K线 数据"""
