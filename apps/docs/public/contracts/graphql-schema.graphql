"""
策略风险等级

- LOW: 低风险 - 保守型策略,适合风险厌恶型投资者
- MEDIUM: 中风险 - 平衡型策略,风险和收益相对均衡
- HIGH: 高风险 - 激进型策略,追求高收益但承担较高风险
- VERY_HIGH: 极高风险 - 高杠杆或高频策略,需要专业投资者
"""
enum RiskLevel {
  LOW
  MEDIUM
  HIGH
  VERY_HIGH
}

