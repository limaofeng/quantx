query IOSStrategyInstances {
  strategyInstances {
    id
    strategyKey
    strategyId
    strategyName
    instrumentCode
    displayName
    status
    mode
    parameterVersion
    createdAt
    updatedAt
    lastDecisionAt
    latestExecutionStatus
  }
}

query IOSStrategyInstanceMobileParameters($instanceId: String!) {
  strategyInstanceMobileParameters(instanceId: $instanceId) {
    instanceId
    configVersion
    editable
    parameters {
      key
      title
      description
      valueType
      currentValue
      unit
      minimum
      maximum
      step
      enumValues
      applyImmediately
      riskLevel
    }
  }
}

mutation IOSUpdateStrategyInstanceParameters(
  $instanceId: String!
  $input: StrategyInstanceParameterUpdateInput!
) {
  updateStrategyInstanceParameters(instanceId: $instanceId, input: $input) {
    id
    mode
    status
    parameterVersion
    updatedAt
  }
}

mutation IOSPauseStrategyInstance($instanceId: String!) {
  pauseStrategyInstance(instanceId: $instanceId) {
    success
    message
  }
}

mutation IOSResumeStrategyInstance($instanceId: String!) {
  resumeStrategyInstance(instanceId: $instanceId) {
    success
    message
  }
}

mutation IOSPreviewStrategyControl($input: StrategyControlPreviewInput!) {
  previewStrategyControl(input: $input) {
    success
    code
    message
    preview {
      challengeId
      confirmationToken
      accountId
      instanceId
      targetInstanceId
      action
      currentMode
      currentStatus
      configVersion
      readinessStatus
      snapshotId
      snapshotAt
      challengeExpiresAt
      checks {
        code
        passed
        message
      }
      warnings
    }
  }
}

mutation IOSConfirmStrategyControl($input: StrategyControlConfirmationInput!) {
  confirmStrategyControl(input: $input) {
    success
    code
    message
    challengeId
    instanceId
    status
  }
}

query IOSLimitUpBoardAssistant($runId: String!) {
  strategyPendingTradeIntents(runId: $runId) {
    id
    runId
    instrumentCode
    side
    bucket
    reason
    status
    executionMode
    confidence
    limitPriceHint
    targetPositionPct
    targetAmount
    targetVolume
    signalPrice
    limitUpPrice
    distanceToLimitTicks
    approvalExpiresAt
    createdAt
  }
  strategyExitPlans(runId: $runId) {
    id
    instrumentCode
    sourceType
    bucket
    status
    entryFilledVolume
    entryAvgPrice
    exitedVolume
    exitAvgPrice
    remainingVolume
    peakPrice
    lastPrice
    lastNetProfitPct
    peakNetProfitPct
    holdingTradingDays
    pendingIntentId
    pendingOrderId
    lastExitReason
    t1Policy
    executionMode
    autoExitAuthorized
    ruleTypes
  }
}
