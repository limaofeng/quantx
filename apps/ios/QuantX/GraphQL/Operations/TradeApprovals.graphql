mutation IOSPreviewTTradeEntryApproval($runId: String!, $intentId: String!) {
  previewTTradeEntryApproval(runId: $runId, intentId: $intentId) {
    success
    code
    message
    preview {
      challengeId
      confirmationToken
      action
      accountId
      runId
      intentId
      instrumentCode
      side
      bucket
      reason
      targetVolume
      referencePrice
      estimatedAmount
      signalExpiresAt
      challengeExpiresAt
      warnings
    }
  }
}

mutation IOSConfirmTTradeEntryApproval(
  $runId: String!
  $intentId: String!
  $confirmationToken: String!
) {
  confirmTTradeEntryApproval(
    runId: $runId
    intentId: $intentId
    confirmationToken: $confirmationToken
  ) {
    success
    code
    message
    challengeId
  }
}

