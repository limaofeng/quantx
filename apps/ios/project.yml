name: QuantX

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  groupSortPosition: top
  minimumXcodeGenVersion: 2.46.0

configs:
  Debug: debug
  Staging: release
  Release: release

packages:
  Apollo:
    url: https://github.com/apollographql/apollo-ios.git
    exactVersion: 2.1.2

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0

targets:
  QuantX:
    type: application
    platform: iOS
    sources:
      - path: QuantX
    dependencies:
      - package: Apollo
        product: Apollo
      - package: Apollo
        product: ApolloWebSocket
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: QuantX/Resources/QuantX.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QuantX/Resources/Info.plist
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREPROCESSOR_DEFINITIONS: DEBUG_HTTP_ALLOWED=$(DEBUG_HTTP_ALLOWED)
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: $(QUANTX_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: QuantX
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      gatherCoverageData: true
      testTargets:
        - QuantXTests
        - QuantXUITests

  QuantXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuantXTests
    dependencies:
      - target: QuantX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.limaofeng.quantx.tests

  QuantXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QuantXUITests
    dependencies:
      - target: QuantX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.limaofeng.quantx.uitests
        TEST_TARGET_NAME: QuantX

schemes:
  QuantX:
    build:
      targets:
        QuantX: all
        QuantXTests: [test]
        QuantXUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - QuantXTests
        - QuantXUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  QuantXRealBackend:
    build:
      targets:
        QuantX: all
        QuantXTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - QuantXTests
      environmentVariables:
        QUANTX_IOS_ALLOW_DEVELOPMENT_LOGIN: "1"
        QUANTX_IOS_REAL_BACKEND_URL: "$(QUANTX_AUTH_BASE_URL)"

  QuantXRealBackendUI:
    build:
      targets:
        QuantX: all
        QuantXUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - QuantXUITests
      environmentVariables:
        QUANTX_IOS_ALLOW_REAL_UI_TEST: "1"
        QUANTX_IOS_REAL_BACKEND_URL: "$(QUANTX_AUTH_BASE_URL)"
