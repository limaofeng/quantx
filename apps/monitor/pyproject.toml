[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-monitor"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "httpx>=0.24.0",
  "pydantic-settings>=2.0.0",
  "redis>=4.0.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
quantx-monitor = "quantx_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
