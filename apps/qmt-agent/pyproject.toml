[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-qmt-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.24.0",
  "keyring>=25.0",
  "orjson>=3.10.0",
  "quantx-contracts",
  "websockets>=11.0",
]

[project.scripts]
quantx-qmt-agent = "quantx_qmt_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
