study: indicator-study
version: v1
date_range: [2026-02-05, 2026-06-05]
indicator_ids: [volume_ratio, change_pct, consecutive_down_days]
# Acceptance example only, not an optimized or recommended selection rule.
conditions:
  - {indicator_id: volume_ratio, operator: between, value: 0.8, value_to: 1.5}
  - {indicator_id: change_pct, operator: lt, value: 0}
universe:
  instrument_type: stock
  stock_codes: [000333.SZ, 600036.SH]
  exclude_st: false
  include_industries: []
  exclude_industries: []
statistics:
  bootstrap_samples: 100
  minimum_cell_samples: 3
  minimum_inference_dates: 30
runtime:
  batch_size: 2
  minimum_available_memory_gib: 1
  output_root: .runtime/research-runs
