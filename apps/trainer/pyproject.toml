[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-trainer"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["quantx-application", "quantx-infrastructure"]

[project.scripts]
quantx-trainer = "quantx_trainer.main:main"
quantx-trainer-config-check = "quantx_trainer.config:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
