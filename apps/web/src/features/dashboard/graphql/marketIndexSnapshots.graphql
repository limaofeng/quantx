query Dashboard_MarketIndexSnapshots($stockList: [String!]!) {
  marketIndexSnapshots(stockList: $stockList) {
    stockCode
    quote {
      stockCode
      time
      lastPrice
      open
      high
      low
      preClose
      volume
    }
    dailyKline {
      stockCode
      time
      open
      high
      low
      close
      preClose
      volume
    }
  }
}
