query Portfolio_TAssistantLiveApprovalQueue($accountId: String!) {
  tAssistantLiveApprovalQueue(accountId: $accountId) {
    executionId
    status
    entryAuthorization
    entryReadiness
    reasonCodes
    truncated
    entries {
      intentId
      instrumentCode
      status
      requestedAmount
      reason
      expiresAt
      canPreview
      confirmationStatus
    }
  }
}
mutation Portfolio_PreviewTAssistantLiveEntry(
  $accountId: String!
  $executionId: String!
  $intentId: String!
) {
  previewTAssistantLiveEntry(
    accountId: $accountId
    executionId: $executionId
    intentId: $intentId
  ) {
    success
    code
    message
    preview {
      challengeId
      confirmationToken
      accountId
      intentId
      instrumentCode
      side
      bucket
      reason
      targetVolume
      referencePrice
      estimatedAmount
      signalExpiresAt
      challengeExpiresAt
      warnings
      executionOwner {
        ownerType
        ownerId
      }
      environment
      tTradeAutoExitAuthorization {
        planId
        maxProtectedVolume
        rules
        t1Policy
        executionPolicy
        executionSemantics
        authorizationExpiresAt
      }
    }
  }
}
mutation Portfolio_ConfirmTAssistantLiveEntry(
  $accountId: String!
  $executionId: String!
  $intentId: String!
  $confirmationToken: String!
) {
  confirmTAssistantLiveEntry(
    accountId: $accountId
    executionId: $executionId
    intentId: $intentId
    confirmationToken: $confirmationToken
  ) {
    success
    code
    message
    challengeId
  }
}

mutation Portfolio_PreviewTAssistantLiveRelease(
  $request: TAssistantReleaseRequest!
) {
  previewTAssistantLiveRelease(request: $request) {
    success
    code
    message
    preview {
      challengeId
      confirmationToken
      expiresAt
      accountId
      sourceExecutionId
      configVersionId
      configSnapshotHash
      reportHash
      policyHash
      windowStart
      windowEnd
    }
  }
}

mutation Portfolio_ConfirmTAssistantLiveRelease(
  $challengeId: String!
  $confirmationToken: String!
) {
  confirmTAssistantLiveRelease(
    challengeId: $challengeId
    confirmationToken: $confirmationToken
  ) {
    success
    code
    message
    engineCommandId
  }
}

query Portfolio_TAssistantLiveReleaseStatus($challengeId: String!) {
  tAssistantLiveReleaseStatus(challengeId: $challengeId) {
    challengeId
    status
    engineCommandId
    executionId
    executionStatus
    reasonCode
  }
}

query TAssistantLiveReleaseOperations($accountId: String!, $limit: Int!) {
  tAssistantLiveReleaseOperations(accountId: $accountId, limit: $limit) {
    challengeId
    accountId
    configVersionId
    createdAt
  }
}

mutation Portfolio_PrepareTAssistantLegacyInventory(
  $requestId: String!
  $request: TAssistantLegacyInventoryRequest!
) {
  prepareTAssistantLegacyInventory(requestId: $requestId, request: $request) {
    success
    code
    message
    engineCommandId
  }
}
mutation Portfolio_PreviewTAssistantLegacyDrain(
  $request: TAssistantLegacyDrainRequest!
) {
  previewTAssistantLegacyDrain(request: $request) {
    success
    code
    message
    preview {
      challengeId
      confirmationToken
      expiresAt
      request
    }
  }
}
mutation Portfolio_ConfirmTAssistantLegacyDrain(
  $challengeId: String!
  $confirmationToken: String!
) {
  confirmTAssistantLegacyDrain(
    challengeId: $challengeId
    confirmationToken: $confirmationToken
  ) {
    success
    code
    message
    engineCommandId
  }
}
mutation Portfolio_CompleteTAssistantLegacyDrain(
  $accountId: String!
  $drainCommandId: String!
  $expectedHeadVersion: Int!
) {
  completeTAssistantLegacyDrain(
    accountId: $accountId
    drainCommandId: $drainCommandId
    expectedHeadVersion: $expectedHeadVersion
  ) {
    success
    code
    message
    engineCommandId
  }
}

query Portfolio_TAssistantLegacyMaintenanceOperation(
  $accountId: String!
  $commandId: String!
) {
  tAssistantLegacyMaintenanceOperation(
    accountId: $accountId
    commandId: $commandId
  ) {
    commandId
    status
    evidence
  }
}

query Portfolio_TAssistantLegacyConfirmationStatus($challengeId: String!) {
  tAssistantLegacyConfirmationStatus(challengeId: $challengeId) {
    challengeId
    status
    engineCommandId
    request
  }
}

query Portfolio_TAssistantLegacyMaintenanceSource($accountId: String!) {
  tAssistantLegacyMaintenanceSource(accountId: $accountId) {
    accountId
    configId
    runId
    headVersion
    draining
  }
}
