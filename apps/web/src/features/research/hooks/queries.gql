query ResearchRuns(
  $limit: Int = 50
  $offset: Int = 0
  $status: String
  $studyId: String
) {
  researchRuns(
    limit: $limit
    offset: $offset
    status: $status
    studyId: $studyId
  ) {
    items {
      key
      runId
      studyId
      version
      status
      startedAt
      completedAt
      eventCount
      elapsedSeconds
      configHash
      hasMetrics
      artifactErrors
    }
    total
    limit
    offset
  }
}

query ResearchRun($key: String!) {
  researchRun(key: $key) {
    summary {
      key
      runId
      studyId
      version
      status
      startedAt
      completedAt
      eventCount
      elapsedSeconds
      configHash
      hasMetrics
      artifactErrors
    }
    analysisSampleCount
    indicatorReports {
      runKey
      reportId
      kind
      indicatorIds
      studyId
      version
      runId
      completedAt
      dataStart
      dataEnd
      configHash
      warnings
    }
    selectionMetrics
    dataQuality
    eventCurve
    interactionHeatmap
    comparison
    comparisonSensitivity
    regressions
    robustness
    warnings
    artifactErrors
  }
}
