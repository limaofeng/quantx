# Strategies 模块查询操作

# 获取所有策略
query strategies($includeAssistantManaged: Boolean! = false) {
  strategies(includeAssistantManaged: $includeAssistantManaged) {
    id
    name
    description
    className
    filePath
    category
    riskLevel
    status
    tags
    version
    codeHash
    instrumentScope
    instrumentUniverseMode
    parameterSchema {
      type
      required
      additionalProperties
      properties {
        key
        value {
          type
          title
          description
          default
          minimum
          maximum
          step
          enum
          enumDescriptions
          placeholder
          unit
          widget
          group
        }
      }
    }
    defaultParameters
    isActive
    createdAt
    updatedAt
  }
}

# 获取单个策略详情
query strategy($strategyId: Int!) {
  strategy(strategyId: $strategyId) {
    id
    name
    description
    riskLevel
    category
    status
    instrumentScope
    instrumentUniverseMode
    defaultParameters
    parameterSchema {
      type
      required
      additionalProperties
      properties {
        key
        value {
          type
          title
          description
          default
          minimum
          maximum
          step
          enum
          enumDescriptions
          placeholder
          unit
          widget
          group
        }
      }
    }
  }
}

# 获取策略运行状态
query strategyRuns {
  strategyRuns {
    id
    name
    strategy {
      id
      name
    }
    instruments
    parameters
    mode
    status
    profitLoss
    totalTrades
    metrics
    errorMessage
    createTime
    startTime
    stopTime
  }
}

# 获取单个策略运行详情
query strategyRun($runId: String!) {
  strategyRun(runId: $runId) {
    id
    name
    strategy {
      id
      name
    }
    instruments
    parameters
    mode
    status
    profitLoss
    totalTrades
    metrics
    errorMessage
    createTime
    startTime
    stopTime
  }
}

query LimitUpBoardWorkbench(
  $runId: String!
  $backtestId: String
  $includePerformance: Boolean!
) {
  strategyPendingTradeIntents(runId: $runId) {
    id
    runId
    instrumentCode
    side
    bucket
    reason
    status
    executionMode
    confidence
    limitPriceHint
    targetPositionPct
    targetAmount
    targetPositionPct
    targetVolume
    signalPrice
    limitUpPrice
    distanceToLimitTicks
    approvalExpiresAt
    createdAt
    metadata
  }
  strategyExitPlans(runId: $runId) {
    id
    instrumentCode
    sourceType
    bucket
    status
    entryFilledVolume
    entryAvgPrice
    exitedVolume
    exitAvgPrice
    remainingVolume
    peakPrice
    lastPrice
    lastNetProfitPct
    peakNetProfitPct
    holdingTradingDays
    entryTradeDate
    pendingIntentId
    pendingOrderId
    lastExitReason
    t1Policy
    executionMode
    autoExitAuthorized
    ruleTypes
    raw
  }
  strategyPerformance(
    runId: $runId
    backtestId: $backtestId
    limit: 2000
  ) @include(if: $includePerformance) {
    summary
    executionQuality
    dataQuality {
      status
      warning
      sampleCount
    }
  }
}

query LimitUpBoardAssistantDesk($accountId: String!) {
  limitUpBoardAssistant(accountId: $accountId) {
    configId
    strategyRunId
    accountId
    enabled
    mode
    autoExitAcknowledged
    configVersion
    universeRevision
    maxSinglePositionPct
    maxDailyExposurePct
    plannedTailLossPct
    maxOpenPositions
    maxRankedCandidates
    promotionModelMode
    entryDistanceTicks
    entryStartTime
    entryEndTime
    approvalTtlMs
    entryOrderTtlMs
    maxPriceDeviationBps
    executionQuoteMaxAgeSeconds
    maxEntryAttemptsPerDay
    exitLimitBreakTicks
    exitMinSealSeconds
    exitTrailingArmProfitPct
    exitTrailingDrawdownPct
    exitTrailingPercent
    maxHoldingTradingDays
    maxHoldingExitTime
    exitMaxSlippageBps
    armedCandidates {
      instrumentCode
      source
      armVersion
      armedAt
    }
    manualArmedCount
    pendingSignalCount
    activeExitPlanCount
    monitoredCount
    runStatus
    engineStatus
    agentStatus
    reconcileStatus
    killSwitch
    canApprove
    canActivateLive
    blockedReasons
    lastReconciledAt
    lastError
    projectionVersion
    projectionGeneratedAt
  }
}

query LimitUpBoardAssistantRuntime($runId: String!) {
  strategyPendingTradeIntents(runId: $runId) {
    id
    instrumentCode
    reason
    confidence
    limitPriceHint
    targetAmount
    signalPrice
    limitUpPrice
    distanceToLimitTicks
    approvalExpiresAt
    createdAt
    metadata
  }
  strategyExitPlans(runId: $runId) {
    id
    instrumentCode
    status
    entryFilledVolume
    entryAvgPrice
    exitedVolume
    remainingVolume
    lastPrice
    lastNetProfitPct
    peakNetProfitPct
    holdingTradingDays
    entryTradeDate
    pendingIntentId
    pendingOrderId
    lastExitReason
    t1Policy
    executionMode
    autoExitAuthorized
    ruleTypes
    raw
  }
}

mutation SaveLimitUpBoardAssistant($input: LimitUpBoardAssistantSettingsInput!) {
  saveLimitUpBoardAssistant(input: $input) {
    success
    code
    message
  }
}

mutation SaveFirstBoardAssistant($input: LimitUpBoardAssistantSettingsInput!) {
  saveFirstBoardAssistant(input: $input) {
    success
    code
    message
  }
}

mutation SetFirstBoardCandidatePreference($input: FirstBoardCandidatePreferenceInput!) {
  setFirstBoardCandidatePreference(input: $input) {
    success
    code
    message
  }
}

mutation ReconcileLimitUpBoardAssistant($accountId: String!) {
  reconcileLimitUpBoardAssistant(accountId: $accountId) {
    success
    code
    message
  }
}

mutation ArmLimitUpBoardCandidate($input: LimitUpBoardCandidateActionInput!) {
  armLimitUpBoardCandidate(input: $input) {
    success
    code
    message
  }
}

mutation DisarmLimitUpBoardCandidate($input: LimitUpBoardCandidateActionInput!) {
  disarmLimitUpBoardCandidate(input: $input) {
    success
    code
    message
  }
}

subscription LimitUpBoardAssistantUpdates($accountId: String!) {
  limitUpBoardAssistantUpdates(accountId: $accountId) {
    accountId
    version
    occurredAt
  }
}

subscription FirstBoardPromotionUpdates($accountId: String!) {
  firstBoardPromotionUpdates(accountId: $accountId) {
    accountId
    version
    occurredAt
  }
}

