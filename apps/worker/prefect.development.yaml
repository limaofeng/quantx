name: quantx-development-worker
deployments:
  - name: research-result-import
    entrypoint: apps/worker/src/quantx_worker/prefector/flows/research_result_import_flow.py:research_result_import_flow
    work_pool:
      name: quantx-dev-pool
      work_queue_name: default
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: '* * * * *'
        timezone: Asia/Shanghai
  - name: research-preparation-dispatch
    entrypoint: apps/worker/src/quantx_worker/prefector/flows/research_preparation_flow.py:research_preparation_dispatch_flow
    work_pool:
      name: quantx-dev-pool
      work_queue_name: default
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: '* * * * *'
        timezone: Asia/Shanghai
