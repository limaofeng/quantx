[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "lightgbm>=4.5.0,<5",
  "prefect==3.6.15",
  "importlib-metadata>=8.7",
  "quantx-application",
  "quantx-infrastructure",
  "quantx-research",
]

[project.scripts]
quantx-worker-bootstrap = "quantx_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
