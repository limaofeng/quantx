name: quantx-backend
deployments:
  - name: market-sync
    entrypoint: prefector/flows/market_sync_flow.py:market_sync_flow
    work_queue_name: default
    description: 全市场基础数据同步（A股/ETF/指数）
    schedules:
      - cron: "0 8 * * 1-5"
        timezone: Asia/Shanghai
    version: "0.0.1"
  - name: position-sync
    entrypoint: prefector/flows/position_sync_flow.py:position_sync_flow
    work_queue_name: default
    description: 同步持仓，并可选同步持仓标的 tick 数据
    schedules:
      - cron: "0 8 * * 1-5"
        timezone: Asia/Shanghai
        parameters:
          sync_market_data: false
      - cron: "30 15 * * 1-5"
        timezone: Asia/Shanghai
    version: "0.0.2"
  - name: instrument-sync
    entrypoint: prefector/flows/instrument_sync_flow.py:instrument_sync_flow
    work_queue_name: default
    description: 单个标的数据同步（基础信息+财务数据）
    version: "0.0.1"
  - name: financial-sync
    entrypoint: prefector/flows/batch_financial_sync_flow.py:batch_financial_sync_flow
    work_queue_name: default
    description: 财务数据同步（支持全市场或指定股票列表）
    schedules:
      - cron: "0 9 * * 1-5"
        timezone: Asia/Shanghai
    version: "0.1.2"
  - name: bond-repo-sync
    entrypoint: prefector/flows/bond_repo_flow.py:bond_repo_sync_flow
    work_queue_name: default
    description: 批量同步国债逆回购数据
    schedules:
      - cron: "0 8 * * 1-5"
        timezone: Asia/Shanghai
    version: "0.0.1"
  - name: bond-repo-auto-trade
    entrypoint: prefector/flows/bond_repo_flow.py:bond_repo_auto_trade_flow
    work_queue_name: default
    description: 国债逆回购自动交易
    schedules:
      - cron: "10 15 * * 1-5"
        timezone: Asia/Shanghai
    version: "0.0.1"
  - name: daily-trading-sync
    entrypoint: prefector/flows/daily_trading_sync_flow.py:daily_trading_sync_flow
    work_queue_name: default
    description: 每日交易数据同步（委托、成交、持仓）
    schedules:
      - cron: "30 11 * * 1-5"
        timezone: Asia/Shanghai
      - cron: "30 15 * * 1-5"
        timezone: Asia/Shanghai
      - cron: "00 16 * * 1-5"
        timezone: Asia/Shanghai
      - cron: "00 23 * * 1-5"
        timezone: Asia/Shanghai
    version: "0.0.1"
  - name: sector-data-sync
    entrypoint: prefector/flows/sector_data_flow.py:sector_data_sync_flow
    work_queue_name: default
    description: 同步行业板块数据
    schedules:
      - cron: "0 18 * * 1-5"
        timezone: Asia/Shanghai
    version: "0.0.1"
  - name: holiday-sync
    entrypoint: prefector/flows/holiday_sync_flow.py:holiday_sync_flow
    work_queue_name: default
    description: 节假日休市安排同步
    schedules:
      - cron: "30 7 1 * *"
        timezone: Asia/Shanghai
    version: "0.0.1"
  - name: daily-market-data-sync
    entrypoint: prefector/flows/daily_market_data_sync_flow.py:daily_market_data_sync_flow
    work_queue_name: default
    description: 每日市场数据同步（K线/tick数据）
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
      grace_period_seconds: 120
    schedules:
      - cron: "5 15 * * 1-5"
        timezone: Asia/Shanghai
        parameters:
          periods: ["1m", "1d"]
          sectors: ["沪深A股", "沪深ETF", "沪深指数"]
    version: "0.0.4"
  - name: daily-indicator-snapshot
    entrypoint: prefector/flows/daily_indicator_snapshot_flow.py:daily_indicator_snapshot_flow
    work_queue_name: default
    description: 每日技术指标快照（A股+ETF）MA/RSI/KDJ/BOLL，供选股引擎使用
    schedules:
      - cron: "35 15 * * 1-5"
        timezone: Asia/Shanghai
        parameters:
          sectors: ["沪深A股", "沪深ETF"]
          batch_size: 300
          retain_days: 30
    version: "0.1.0"
