name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 创建 GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build production
        run: npm run build
        env:
          VITE_APP_ENV: production

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges $PREVIOUS_TAG..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 新版本发布

            ### 📝 更新内容
            ${{ steps.changelog.outputs.changelog }}

            ### 🔧 技术信息
            - **构建时间**: ${{ steps.date.outputs.date }}
            - **提交哈希**: ${{ github.sha }}
            - **Node.js 版本**: 18

            ### 📦 部署说明
            请按照 README.md 中的部署指南进行部署。

          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

      - name: Upload build assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist.zip
          asset_name: quantx-web-${{ github.ref_name }}.zip
          asset_content_type: application/zip

  # 部署到生产环境
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [release]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
          VITE_GRAPHQL_URL: ${{ secrets.PROD_GRAPHQL_URL }}

      - name: Deploy to production
        run: |
          echo "Deploying version ${{ github.ref_name }} to production..."
          # 添加实际的生产部署命令

  # 通知
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()

    steps:
      - name: Notify on success
        if: needs.deploy-production.result == 'success'
        run: |
          echo "✅ 版本 ${{ github.ref_name }} 已成功部署到生产环境"
          # 可以添加 Slack/钉钉/企业微信通知

      - name: Notify on failure
        if: needs.deploy-production.result == 'failure'
        run: |
          echo "❌ 版本 ${{ github.ref_name }} 部署失败"
          # 可以添加失败通知