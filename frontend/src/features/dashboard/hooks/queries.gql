# Dashboard 模块查询操作

# 获取当前账户信息 - 用于 Layout 头部显示
query GetCurrentAccount {
  currentAccount {
    id
    accountName
    accountType
    totalAsset
    cash
    frozenCash
    marketValue
    totalProfitLoss
    profitLossPercent
    createTime
    updateTime
  }
}

