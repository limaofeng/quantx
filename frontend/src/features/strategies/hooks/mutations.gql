# 在当前回测实例下新增一个回测版本
mutation RerunBacktestVersion(
  $runId: String!
  $backtestStartTime: DateTime
  $backtestEndTime: DateTime
) {
  rerunBacktestVersion(
    runId: $runId
    backtestStartTime: $backtestStartTime
    backtestEndTime: $backtestEndTime
  ) {
    id
    strategyRunId
    version
    backtestStartTime
    backtestEndTime
    status
    createdAt
  }
}

# 删除策略运行实例
mutation DeleteStrategyRun($runId: String!) {
  deleteStrategyRun(runId: $runId) {
    success
    message
  }
}

# 更新策略运行（目前仅支持更新参数）
mutation UpdateStrategyRun($runId: String!, $parameters: JSON) {
  updateStrategyRun(runId: $runId, runUpdate: { parameters: $parameters }) {
    id
    parameters
  }
}
