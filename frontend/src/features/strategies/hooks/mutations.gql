# Strategies 模块变更操作

# 运行策略（创建运行实例）
mutation RunStrategy($input: StrategyRunInput!, $autoStart: Boolean! = true) {
  runStrategy(input: $input, autoStart: $autoStart) {
    id
    name
    status
    strategy {
      id
      name
    }
    createTime
  }
}

# 启动策略
mutation StartStrategy($runId: String!) {
  startStrategy(runId: $runId) {
    success
    message
  }
}

# 停止策略
mutation StopStrategy($runId: String!) {
  stopStrategy(runId: $runId) {
    success
    message
  }
}

# 暂停策略
mutation PauseStrategy($runId: String!) {
  pauseStrategy(runId: $runId) {
    success
    message
  }
}

# 恢复策略
mutation ResumeStrategy($runId: String!) {
  resumeStrategy(runId: $runId) {
    success
    message
  }
}

