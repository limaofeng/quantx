apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: quantx-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantx-api
        app.kubernetes.io/part-of: quantx
    spec:
      serviceAccountName: quantx-runtime
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: quantx-server
          imagePullPolicy: IfNotPresent
          command: ['python', '-m', 'uvicorn']
          args:
            - quantx_api.main:app
            - --host
            - 0.0.0.0
            - --port
            - '18081'
            - --ws-ping-interval
            - '20'
            - --ws-ping-timeout
            - '960'
          envFrom:
            - configMapRef:
                name: quantx-platform-config
            - configMapRef:
                name: quantx-runtime-config
            - secretRef:
                name: quantx-runtime-secrets
          env:
            - name: DATABASE_PROCESS_ROLE
              value: api
          ports:
            - name: http
              containerPort: 18081
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: /health/service-ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime
              mountPath: /var/lib/quantx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: quantx-api
  ports:
    - name: http
      port: 18081
      targetPort: http
