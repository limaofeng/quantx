apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: quantx-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantx-engine
        app.kubernetes.io/part-of: quantx
    spec:
      serviceAccountName: quantx-runtime
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: quantx-server
          command: ['python', '-m', 'quantx_engine.main']
          envFrom:
            - configMapRef:
                name: quantx-platform-config
            - configMapRef:
                name: quantx-runtime-config
            - secretRef:
                name: quantx-runtime-secrets
          env:
            - name: DATABASE_PROCESS_ROLE
              value: engine
            - name: QUANTX_ENGINE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: '3'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
