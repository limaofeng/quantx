apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: quantx-market-data-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantx-market-data-service
        app.kubernetes.io/part-of: quantx
    spec:
      serviceAccountName: quantx-runtime
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: market-data-service
          image: quantx-server
          command: ['python', '-m', 'uvicorn']
          args:
            - quantx_api.market_data_service:app
            - --host
            - 0.0.0.0
            - --port
            - '18082'
            - --ws-max-size
            - '67108864'
            - --ws-ping-interval
            - '20'
            - --ws-ping-timeout
            - '960'
          envFrom:
            - configMapRef:
                name: quantx-platform-config
            - configMapRef:
                name: quantx-runtime-config
            - secretRef:
                name: quantx-runtime-secrets
          env:
            - name: DATABASE_PROCESS_ROLE
              value: market-data-service
          ports:
            - name: http
              containerPort: 18082
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: market-data-service
spec:
  selector:
    app.kubernetes.io/name: quantx-market-data-service
  ports:
    - name: http
      port: 18082
      targetPort: http
