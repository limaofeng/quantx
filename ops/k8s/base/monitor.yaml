apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monitor
spec:
  serviceName: monitor
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: quantx-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantx-monitor
        app.kubernetes.io/part-of: quantx
    spec:
      serviceAccountName: quantx-runtime
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitor
          image: quantx-server
          command: ['python', '-m', 'quantx_monitor.main']
          envFrom:
            - configMapRef:
                name: quantx-platform-config
            - configMapRef:
                name: quantx-runtime-config
            - secretRef:
                name: quantx-runtime-secrets
          ports:
            - name: http
              containerPort: 18083
          startupProbe:
            httpGet:
              path: /monitor/health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: /monitor/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /monitor/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: history
              mountPath: /var/lib/quantx-monitor
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: history
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: monitor
spec:
  selector:
    app.kubernetes.io/name: quantx-monitor
  ports:
    - name: http
      port: 18083
      targetPort: http
