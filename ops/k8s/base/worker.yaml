apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: quantx-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantx-worker
        app.kubernetes.io/part-of: quantx
    spec:
      serviceAccountName: quantx-runtime
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: quantx-server
          command: ['python', '-m', 'quantx_worker.main']
          envFrom:
            - configMapRef:
                name: quantx-platform-config
            - configMapRef:
                name: quantx-runtime-config
            - secretRef:
                name: quantx-runtime-secrets
          env:
            - name: DATABASE_PROCESS_ROLE
              value: worker
            - name: PREFECT_WORKER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: prefect-home
              mountPath: /var/lib/quantx/prefect
      volumes:
        - name: tmp
          emptyDir: {}
        - name: prefect-home
          emptyDir: {}
