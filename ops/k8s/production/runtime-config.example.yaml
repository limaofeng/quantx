apiVersion: v1
kind: ConfigMap
metadata:
  name: quantx-runtime-config
  namespace: quantx
data:
  # Replace every example value before applying. PUBLIC_URL is the only browser,
  # iOS, and QMT Agent origin and must terminate TLS before reaching gateway:8080.
  PUBLIC_URL: https://quantx.example.com
  CORS_ORIGINS: '["https://quantx.example.com"]'
  AUTH_WEB_ALLOWED_ORIGINS: '["https://quantx.example.com"]'
  MONITOR_PUBLIC_BASE_URL: https://quantx.example.com
  MONITOR_QMT_AGENT_HEALTH_URL: http://windows-qmt.internal:18084

  DEBUG: 'false'
  GRAPHQL_DEBUG: 'false'
  GRAPHQL_INTROSPECTION: 'false'
  GRAPHQL_PLAYGROUND: 'false'
  MOCK_DATA_ENABLED: 'false'
  AUTH_WEB_COOKIE_SECURE: 'true'

  REDIS_HOST: redis.example.internal
  REDIS_PORT: '6379'
  REDIS_DB: '0'
  INFLUXDB_HOST: https://influxdb.example.internal
  INFLUXDB_DATABASE: quantx_market_data
  INFLUXDB_SSL_VERIFY: 'true'
  PREFECT_ENABLED: 'true'
  PREFECT_API_URL: https://prefect.example.internal/api
  PREFECT_WORKER_POOL: quantx-pool

  ENABLE_REAL_TRADING: 'false'
  QMT_REAL_TRADING_ENABLED: 'false'
  T_TRADE_LIVE_ENABLED: 'false'
  AI_ASSISTANT_ENABLED: 'false'
  AI_ASSISTANT_TRACING_ENABLED: 'false'
