apiVersion: v1
kind: Secret
metadata:
  name: quantx-runtime-secrets
  namespace: quantx
type: Opaque
stringData:
  # Example keys only. Use External Secrets/Sealed Secrets or the cluster's
  # secret manager; never commit a populated copy.
  SECRET_KEY: replace-with-at-least-48-random-characters
  DATABASE_URL: postgresql+asyncpg://user:password@postgres.example.internal/quantx
  REDIS_URL: rediss://:password@redis.example.internal:6379/0
  REDIS_PASSWORD: replace-me
  INFLUXDB_TOKEN: replace-me
  OPENAI_API_KEY: ''
  REAL_TRADING_ACCOUNT_ALLOWLIST: '[]'
