[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-application"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "quantx-contracts",
  "quantx-domain",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
