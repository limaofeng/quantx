[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-contracts"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
