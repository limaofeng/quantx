[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-domain"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "pydantic>=2.0",
  "quantx-contracts",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
