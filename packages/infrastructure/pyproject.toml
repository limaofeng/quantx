[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-infrastructure"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.13.0",
  "aiofiles",
  "aiohttp>=3.8.0",
  "akshare>=1.18.0",
  "asyncpg>=0.29.0",
  "httpx>=0.24.0",
  "influxdb3-python>=0.13.0",
  "jsonschema>=4.0",
  "loguru>=0.5.0",
  "numpy>=1.21.0",
  "openai>=2.16.0",
  "pandas>=1.3.0",
  "playwright>=1.40.0",
  "psycopg2-binary>=2.9.0",
  "pyarrow>=10.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "pypinyin>=0.55.0",
  "python-dotenv>=0.19.0",
  "python-dateutil>=2.8.0",
  "quantx-application",
  "quantx-contracts",
  "quantx-domain",
  "redis>=4.0.0",
  "requests>=2.28.0",
  "sqlalchemy[asyncio]>=2.0",
  "strawberry-graphql",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
